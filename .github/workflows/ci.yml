name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The parser tests need only a C++17 compiler; nothing in them links Qt.
      - run: sh tests/build.sh

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      # A POSIX build script on Windows runs in MSYS2's MinGW shell, not Git's
      # bash. Git's bash puts Git's own mingw64\bin first on PATH, and a MinGW
      # compiler started from it can load Git's copies of zlib and zstd
      # instead of its own and exit without a word.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - run: sh tests/build.sh

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev
      - run: cmake -B build
      - run: cmake --build build
